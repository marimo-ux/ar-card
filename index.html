<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>MARI | Product Designer AR</title>
    <!-- A-FrameとMindARに加え、3Dモデルのアニメーションを動かすための extras スクリプトを追加 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      #ui-overlay {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(26, 38, 57, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 10px 20px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.08em;
        white-space: nowrap;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      #hidden-video {
        position: fixed;
        top: -9999px;
        left: -9999px;
        width: 1px;
        height: 1px;
        opacity: 0.01;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="ui-overlay">TAP SCREEN &amp; POINT AT CARD</div>

    <video
      id="hidden-video"
      src="./demo.mp4"
      preload="auto"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
    ></video>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
    >
      <a-assets>
        <!-- 3Dの猫モデルを事前にロード（GitHubの cat.glb） -->
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 名刺本体 (幅: 1.0, 高さ: 0.57) -->
      <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        
        <!-- =【新機能】ランダムに歩き・毛づくろいする黒猫 = -->
        <!-- positionやscaleは猫のサイズに合わせて微調整します（ここでは名刺の左下付近からスタート） -->
        <a-entity
          id="black-cat"
          gltf-model="#cat-model"
          position="-0.6 -0.5 0.05"
          scale="0.12 0.12 0.12"
          rotation="90 0 0"
          animation-mixer="clip: walk; loop: repeat; timeScale: 1;"
          shadow="cast: true; receive: false;"
        ></a-entity>

        <!-- 1. 名刺の右側：プロフィール統合エリア -->
        <a-entity position="0.95 0.08 0.02">
          <a-plane
            width="1.0"
            height="0.38"
            color="#1A2639"
            opacity="0.85"
            material="roughness: 1; metalness: 0;"
            position="0.22 0 -0.01"
          ></a-plane>

          <a-plane
            id="avatar-plane"
            position="-0.15 0 0.01"
            width="0.28"
            height="0.28"
            material="transparent: true; alphaTest: 0.05;"
          ></a-plane>

          <a-entity position="0.08 0 0.01">
            <a-text
              value="MARI"
              position="0 0.05 0"
              color="#FFFFFF"
              width="1.5"
              font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
              letter-spacing="4"
            ></a-text>
            <a-text
              value="PRODUCT DESIGNER"
              position="0 -0.05 0"
              color="#CBD5E1"
              width="0.8"
              font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
              letter-spacing="2"
            ></a-text>
          </a-entity>
        </a-entity>

        <!-- 2. 名刺の下：名刺サイズの動画 -->
        <a-plane
          id="video-plane"
          position="0 -0.56 0.02"
          width="1.0"
          height="0.57"
          material="shader: flat; color: #FFFFFF;"
        ></a-plane>

        <!-- 3. 動画の右側：Website / Twitter ボタン -->
        <a-plane
          id="btn-website"
          class="clickable"
          position="0.95 -0.42 0.03"
          width="0.75"
          height="0.18"
          material="transparent: true; alphaTest: 0.05;"
          data-url="https://marimo-ux.github.io/ar-card/"
        ></a-plane>

        <a-plane
          id="btn-twitter"
          class="clickable"
          position="0.95 -0.66 0.03"
          width="0.75"
          height="0.18"
          material="transparent: true; alphaTest: 0.05;"
          data-url="https://x.com/"
        ></a-plane>

        <!-- 4. 最下部：コンタクトアイコン4つ -->
        <a-plane
          id="icon-1"
          class="clickable"
          position="-0.36 -1.02 0.03"
          width="0.22"
          height="0.22"
          material="transparent: true; alphaTest: 0.05;"
          data-url="sms:"
        ></a-plane>

        <a-plane
          id="icon-2"
          class="clickable"
          position="-0.12 -1.02 0.03"
          width="0.22"
          height="0.22"
          material="transparent: true; alphaTest: 0.05;"
          data-url="tel:"
        ></a-plane>

        <a-plane
          id="icon-3"
          class="clickable"
          position="0.12 -1.02 0.03"
          width="0.22"
          height="0.22"
          material="transparent: true; alphaTest: 0.05;"
          data-url="https://cal.com/"
        ></a-plane>

        <a-plane
          id="icon-4"
          class="clickable"
          position="0.36 -1.02 0.03"
          width="0.22"
          height="0.22"
          material="transparent: true; alphaTest: 0.05;"
          data-url="mailto:hello@example.com"
        ></a-plane>

      </a-entity>
    </a-scene>

    <script>
      function createCircularAvatar(imgSrc, targetId) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const size = 512;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2 - 6, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.lineWidth = 10;
          ctx.stroke();

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          const el = document.querySelector(targetId);
          el.getObject3D('mesh').material.map = texture;
          el.getObject3D('mesh').material.needsUpdate = true;
        };
        img.src = imgSrc;
      }

      function createPillButton(label, targetId) {
        const w = 640;
        const h = 164;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        const r = h / 2;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(w - r, 0);
        ctx.arc(w - r, r, r, -Math.PI / 2, Math.PI / 2);
        ctx.lineTo(r, h);
        ctx.arc(r, r, r, Math.PI / 2, -Math.PI / 2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#1A2639';
        ctx.font = '600 52px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, w / 2, h / 2 + 2);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const el = document.querySelector(targetId);
        el.getObject3D('mesh').material.map = texture;
        el.getObject3D('mesh').material.needsUpdate = true;
      }

      function createCircleIcon(type, targetId) {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2 - 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1A2639';
        ctx.strokeStyle = '#1A2639';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const cx = size / 2;
        const cy = size / 2;

        if (type === 'chat') {
          ctx.beginPath();
          ctx.ellipse(cx, cy - 6, 48, 38, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(cx - 26, cy + 24);
          ctx.lineTo(cx - 42, cy + 44);
          ctx.lineTo(cx - 8, cy + 30);
          ctx.fill();
        } else if (type === 'phone') {
          ctx.beginPath();
          ctx.arc(cx + 12, cy - 12, 46, Math.PI * 0.65, Math.PI * 1.35);
          ctx.lineWidth = 18;
          ctx.stroke();
        } else if (type === 'video') {
          ctx.fillRect(cx - 46, cy - 26, 62, 52);
          ctx.beginPath();
          ctx.moveTo(cx + 20, cy - 10);
          ctx.lineTo(cx + 46, cy - 24);
          ctx.lineTo(cx + 46, cy + 24);
          ctx.lineTo(cx + 20, cy + 10);
          ctx.closePath();
          ctx.fill();
        } else if (type === 'mail') {
          ctx.strokeRect(cx - 44, cy - 30, 88, 60);
          ctx.beginPath();
          ctx.moveTo(cx - 44, cy - 30);
          ctx.lineTo(cx, cy + 6);
          ctx.lineTo(cx + 44, cy - 30);
          ctx.stroke();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const el = document.querySelector(targetId);
        el.getObject3D('mesh').material.map = texture;
        el.getObject3D('mesh').material.needsUpdate = true;
      }

      window.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');
        const video = document.querySelector('#hidden-video');
        let isCardFound = false;

        scene.addEventListener('loaded', () => {
          createCircularAvatar('./avatar.jpg', '#avatar-plane');
          createPillButton('Website', '#btn-website');
          createPillButton('Twitter', '#btn-twitter');
          createCircleIcon('chat', '#icon-1');
          createCircleIcon('phone', '#icon-2');
          createCircleIcon('video', '#icon-3');
          createCircleIcon('mail', '#icon-4');

          const videoTexture = new THREE.VideoTexture(video);
          videoTexture.colorSpace = THREE.SRGBColorSpace;
          videoTexture.minFilter = THREE.LinearFilter;
          videoTexture
