<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>MARI | Product Designer AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      #ui-overlay {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(26, 38, 57, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 10px 20px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.08em;
        white-space: nowrap;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
      #hidden-video {
        position: fixed;
        top: -9999px;
        left: -9999px;
        width: 1px;
        height: 1px;
        opacity: 0.01;
        pointer-events: none;
      }
    </style>

    <script>
      // 1. 丸いプロフィール写真コンポーネント
      AFRAME.registerComponent('circular-avatar', {
        schema: { src: { type: 'string' } },
        init: function () {
          const el = this.el;
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size / 2 - 6, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            const minSide = Math.min(img.width, img.height);
            const sx = (img.width - minSide) / 2;
            const sy = (img.height - minSide) / 2;
            ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 10;
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            el.setObject3D('mesh', new THREE.Mesh(
              new THREE.PlaneGeometry(0.28, 0.28),
              new THREE.MeshBasicMaterial({ map: texture, transparent: true, alphaTest: 0.05 })
            ));
          };
          img.src = this.data.src;
        }
      });

      // 2. ピル型ボタンコンポーネント
      AFRAME.registerComponent('pill-button', {
        schema: { label: { type: 'string' } },
        init: function () {
          const w = 640;
          const h = 164;
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');

          const r = h / 2;
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.moveTo(r, 0);
          ctx.lineTo(w - r, 0);
          ctx.arc(w - r, r, r, -Math.PI / 2, Math.PI / 2);
          ctx.lineTo(r, h);
          ctx.arc(r, r, r, Math.PI / 2, -Math.PI / 2);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#1A2639';
          ctx.font = '600 52px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.data.label, w / 2, h / 2 + 2);

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          this.el.setObject3D('mesh', new THREE.Mesh(
            new THREE.PlaneGeometry(0.75, 0.18),
            new THREE.MeshBasicMaterial({ map: texture, transparent: true, alphaTest: 0.05 })
          ));
        }
      });

      // 3. 丸アイコンコンポーネント
      AFRAME.registerComponent('circle-icon', {
        schema: { type: { type: 'string' } },
        init: function () {
          const size = 256;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2 - 4, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#1A2639';
          ctx.strokeStyle = '#1A2639';
          ctx.lineWidth = 10;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          const cx = size / 2;
          const cy = size / 2;
          const type = this.data.type;

          if (type === 'chat') {
            ctx.beginPath();
            ctx.ellipse(cx, cy - 6, 48, 38, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(cx - 26, cy + 24);
            ctx.lineTo(cx - 42, cy + 44);
            ctx.lineTo(cx - 8, cy + 30);
            ctx.fill();
          } else if (type === 'phone') {
            ctx.beginPath();
            ctx.arc(cx + 12, cy - 12, 46, Math.PI * 0.65, Math.PI * 1.35);
            ctx.lineWidth = 18;
            ctx.stroke();
          } else if (type === 'video') {
            ctx.fillRect(cx - 46, cy - 26, 62, 52);
            ctx.beginPath();
            ctx.moveTo(cx + 20, cy - 10);
            ctx.lineTo(cx + 46, cy - 24);
            ctx.lineTo(cx + 46, cy + 24);
            ctx.lineTo(cx + 20, cy + 10);
            ctx.closePath();
            ctx.fill();
          } else if (type === 'mail') {
            ctx.strokeRect(cx - 44, cy - 30, 88, 60);
            ctx.beginPath();
            ctx.moveTo(cx - 44, cy - 30);
            ctx.lineTo(cx, cy + 6);
            ctx.lineTo(cx + 44, cy - 30);
            ctx.stroke();
          }

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          this.el.setObject3D('mesh', new THREE.Mesh(
            new THREE.PlaneGeometry(0.22, 0.22),
            new THREE.MeshBasicMaterial({ map: texture, transparent: true, alphaTest: 0.05 })
          ));
        }
      });

      // 4. 動画パネルコンポーネント
      AFRAME.registerComponent('video-screen', {
        init: function () {
          const video = document.querySelector('#hidden-video');
          const texture = new THREE.VideoTexture(video);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;
          this.el.setObject3D('mesh', new THREE.Mesh(
            new THREE.PlaneGeometry(1.0, 0.57),
            new THREE.MeshBasicMaterial({ map: texture })
          ));
        }
      });
    </script>
  </head>
  <body>
    <div id="ui-overlay">TAP SCREEN &amp; POINT AT CARD</div>

    <video
      id="hidden-video"
      src="./demo.mp4"
      preload="auto"
      loop
      muted
      playsinline
      webkit-playsinline
      crossorigin="anonymous"
    ></video>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 名刺本体 -->
      <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        
        <!-- 1. 名刺の右側：プロフィール統合エリア -->
        <a-entity position="0.95 0.08 0.02">
          <a-plane
            width="1.0"
            height="0.38"
            color="#1A2639"
            opacity="0.85"
            material="shader: flat;"
            position="0.22 0 -0.01"
          ></a-plane>

          <!-- 丸い顔写真 -->
          <a-entity
            position="-0.15 0 0.01"
            circular-avatar="src: ./avatar.jpg"
          ></a-entity>

          <!-- 名前 と 肩書き -->
          <a-entity position="0.08 0 0.01">
            <a-text
              value="MARI"
              position="0 0.05 0"
              color="#FFFFFF"
              width="1.5"
              font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
              letter-spacing="4"
            ></a-text>
            <a-text
              value="PRODUCT DESIGNER"
              position="0 -0.05 0"
              color="#CBD5E1"
              width="0.8"
              font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
              letter-spacing="2"
            ></a-text>
          </a-entity>
        </a-entity>

        <!-- 2. 名刺の下：名刺サイズの動画 -->
        <a-entity
          position="0 -0.56 0.02"
          video-screen
        ></a-entity>

        <!-- 3. 動画の右側：Website / Twitter ボタン -->
        <a-entity
          class="clickable"
          position="0.95 -0.42 0.03"
          pill-button="label: Website"
          data-url="https://marimo-ux.github.io/ar-card/"
        ></a-entity>

        <a-entity
          class="clickable"
          position="0.95 -0.66 0.03"
          pill-button
