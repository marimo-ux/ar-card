<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>MARI | Product Designer AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      #ui-overlay {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(26, 38, 57, 0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 10px 20px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.08em;
        white-space: nowrap;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }
    </style>
  </head>
  <body>
    <div id="ui-overlay">POINT CAMERA AT FRONT OF CARD</div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
    >
      <a-assets>
        <!-- 名刺の下に表示する動画 -->
        <video
          id="card-video"
          src="./demo.mp4"
          preload="auto"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 名刺本体 (幅: 1.0, 高さ: 0.57 を基準としたレイアウト) -->
      <a-entity id="card-target" mindar-image-target="targetIndex: 0">
        
        <!-- 1. 名刺の右側：丸い顔写真 -->
        <a-plane
          id="avatar-plane"
          position="0.82 0.02 0.02"
          width="0.46"
          height="0.46"
          material="transparent: true; alphaTest: 0.05;"
        ></a-plane>

        <!-- 2. 顔写真の右側：名前 と 下に肩書き -->
        <a-entity position="1.15 0.05 0.02">
          <a-text
            value="MARI"
            position="0 0.07 0"
            color="#FFFFFF"
            width="2.2"
            font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
            letter-spacing="4"
          ></a-text>
          <a-text
            value="PRODUCT DESIGNER"
            position="0 -0.07 0"
            color="#E2E8F0"
            width="1.15"
            font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
            letter-spacing="2"
          ></a-text>
        </a-entity>

        <!-- 3. 名刺の下：名刺サイズの動画 -->
        <a-video
          id="video-plane"
          src="#card-video"
          position="0 -0.66 0.02"
          width="1.0"
          height="0.57"
        ></a-video>

        <!-- 4. 動画の右側：ピル型ボタン (Website / Twitter) -->
        <a-plane
          id="btn-website"
          class="clickable"
          position="1.05 -0.52 0.03"
          width="0.82"
          height="0.21"
          material="transparent: true; alphaTest: 0.05;"
          data-url="https://marimo-ux.github.io/ar-card/"
        ></a-plane>

        <a-plane
          id="btn-twitter"
          class="clickable"
          position="1.05 -0.80 0.03"
          width="0.82"
          height="0.21"
          material="transparent: true; alphaTest: 0.05;"
          data-url="https://x.com/"
        ></a-plane>

        <!-- 5. 最下部：4つの丸いアイコン (Message / Phone / Video / Email) -->
        <a-plane
          id="icon-1"
          class="clickable"
          position="-0.22 -1.24 0.03"
          width="0.28"
          height="0.28"
          material="transparent: true; alphaTest: 0.05;"
          data-url="sms:"
        ></a-plane>

        <a-plane
          id="icon-2"
          class="clickable"
          position="0.32 -1.24 0.03"
          width="0.28"
          height="0.28"
          material="transparent: true; alphaTest: 0.05;"
          data-url="tel:"
        ></a-plane>

        <a-plane
          id="icon-3"
          class="clickable"
          position="0.86 -1.24 0.03"
          width="0.28"
          height="0.28"
          material="transparent: true; alphaTest: 0.05;"
          data-url="https://cal.com/"
        ></a-plane>

        <a-plane
          id="icon-4"
          class="clickable"
          position="1.40 -1.24 0.03"
          width="0.28"
          height="0.28"
          material="transparent: true; alphaTest: 0.05;"
          data-url="mailto:hello@example.com"
        ></a-plane>

      </a-entity>
    </a-scene>

    <script>
      // 1. プロフィール写真を丸く切り抜く処理
      function createCircularAvatar(imgSrc, targetId) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const size = 512;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          // 円形マスク
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2 - 6, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          // 画像を中央トリミングして描画
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          // 細い白フチを追加
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.lineWidth = 8;
          ctx.stroke();

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          const el = document.querySelector(targetId);
          el.getObject3D('mesh').material.map = texture;
          el.getObject3D('mesh').material.needsUpdate = true;
        };
        img.src = imgSrc;
      }

      // 2. ピル型（角丸）ボタンの生成
      function createPillButton(label, targetId) {
        const w = 640;
        const h = 164;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        const r = h / 2;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(w - r, 0);
        ctx.arc(w - r, r, r, -Math.PI / 2, Math.PI / 2);
        ctx.lineTo(r, h);
        ctx.arc(r, r, r, Math.PI / 2, -Math.PI / 2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#1A2639';
        ctx.font = '600 54px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, w / 2, h / 2 + 2);

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const el = document.querySelector(targetId);
        el.getObject3D('mesh').material.map = texture;
        el.getObject3D('mesh').material.needsUpdate = true;
      }

      // 3. 下部4つの丸アイコンの生成 (chat / phone / video / mail)
      function createCircleIcon(type, targetId) {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // 白い円背景
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2 - 4, 0, Math.PI * 2);
        ctx.fill();

        // アイコン描画（濃紺）
        ctx.fillStyle = '#1A2639';
        ctx.strokeStyle = '#1A2639';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const cx = size / 2;
        const cy = size / 2;

        if (type === 'chat') {
          ctx.beginPath();
          ctx.ellipse(cx, cy - 6, 48, 38, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(cx - 26, cy + 24);
          ctx.lineTo(cx - 42, cy + 44);
          ctx.lineTo(cx - 8, cy + 30);
          ctx.fill();
        } else if (type === 'phone') {
          ctx.beginPath();
          ctx.arc(cx + 12, cy - 12, 46, Math.PI * 0.65, Math.PI * 1.35);
          ctx.lineWidth = 18;
          ctx.stroke();
        } else if (type === 'video') {
          // カメラ本体
          ctx.fillRect(cx - 46, cy - 26, 62, 52);
          // レンズ三角
          ctx.beginPath();
          ctx.moveTo(cx + 20, cy - 10);
          ctx.lineTo(cx + 46, cy - 24);
          ctx.lineTo(cx + 46, cy + 24);
          ctx.lineTo(cx + 20, cy + 10);
          ctx.closePath();
          ctx.fill();
        } else if (type === 'mail') {
          ctx.strokeRect(cx - 44, cy - 30, 88, 60);
          ctx.beginPath();
          ctx.moveTo(cx - 44, cy - 30);
          ctx.lineTo(cx, cy + 6);
          ctx.lineTo(cx + 44, cy - 30);
          ctx.stroke();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const el = document.querySelector(targetId);
        el.getObject3D('mesh').material.map = texture;
        el.getObject3D('mesh').material.needsUpdate = true;
      }

      // 初期化とイベント設定
      window.addEventListener('DOMContentLoaded', () => {
        const scene = document.querySelector('a-scene');
        scene.addEventListener('loaded', () => {
          createCircularAvatar('./avatar.jpg', '#avatar-plane');
          createPillButton('Website', '#btn-website');
          createPillButton('Twitter', '#btn-twitter');
          createCircleIcon('chat', '#icon-1');
          createCircleIcon('phone', '#icon-2');
          createCircleIcon('video', '#icon-3');
          createCircleIcon('mail', '#icon-4');
        });

        // クリック（タップ）時のリンク遷移
        document.querySelectorAll('.clickable').forEach((el) => {
          el.addEventListener('click', () => {
            const url = el.getAttribute('data-url');
            if (url) window.open(url, '_blank');
          });
        });

        // 名刺認識時にガイドを消し、動画を自動再生する
        const target = document.querySelector('#card-target');
        const overlay = document.querySelector('#ui-overlay');
        const video = document.querySelector('#card-video');

        target.addEventListener('targetFound', () => {
          overlay.style.opacity = '0';
          if (video) video.play().catch(() => {});
        });

        target.addEventListener('targetLost', () => {
          overlay.style.opacity = '1';
          if (video) video.pause();
        });
      });
    </script>
  </body>
</html>
