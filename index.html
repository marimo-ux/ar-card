<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MARI | Product Designer — AR Business Card</title>

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --ui-width: min(90vw, 400px);
      --radius-lg: 32px;
      --radius-md: 24px;
      --navy: #16223b;
      --navy-muted: rgba(22, 34, 59, 0.72);
      --ease-out-expo: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    /* 【修正1】背景を黒(#000)から透過(transparent)にし、背面のカメラ映像が見えるようにする */
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: transparent !important;
      color: var(--navy);
    }

    /* MindARが自動生成するカメラ映像(<video>)を最背面に固定表示 */
    body > video {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    /* MindAR 3Dキャンバスを透明にしてカメラ映像の上に重ねる */
    a-scene, .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    /* =========================================
       厚みのある乳白色＋淡いラベンダーのすりガラス
       ========================================= */
    .lavender-glass {
      position: relative;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.65) 0%,
        rgba(241, 236, 255, 0.54) 52%,
        rgba(222, 212, 252, 0.60) 100%
      );
      backdrop-filter: blur(20px) saturate(135%);
      -webkit-backdrop-filter: blur(20px) saturate(135%);
      border: 1px solid rgba(255, 255, 255, 0.68);
      box-shadow:
        0 14px 34px rgba(26, 20, 56, 0.18),
        0 4px 12px rgba(26, 20, 56, 0.08),
        inset 1.5px 1.5px 1px rgba(255, 255, 255, 0.88),
        inset -1.5px -1.5px 2px rgba(178, 156, 245, 0.55),
        inset 0 0 18px rgba(255, 255, 255, 0.32);
    }

    .lavender-glass::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.1) 45%,
        rgba(186, 164, 255, 0.75) 100%
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* =========================================
       画面固定UIレイヤー
       ========================================= */
    .ui-shell {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-top: max(14px, env(safe-area-inset-top));
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      padding-left: 16px;
      padding-right: 16px;
    }

    /* 【修正2】初期状態は完全に隠しておき、名刺認識時に順番に出現させる */
    .reveal-item {
      width: var(--ui-width);
      opacity: 0;
      transform: translateY(16px) scale(0.97);
      transition:
        opacity 0.65s var(--ease-out-expo),
        transform 0.65s var(--ease-out-expo);
      pointer-events: none;
      visibility: hidden;
    }

    .ui-shell.is-visible .reveal-item {
      pointer-events: auto;
      visibility: visible;
    }

    .ui-shell.is-visible .reveal-1 {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: 0.05s;
    }

    .ui-shell.is-visible .reveal-2 {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: 0.20s;
    }

    .ui-shell.is-visible .reveal-3 {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition-delay: 0.35s;
    }

    /* =========================================
       1. 上部プロフィール
       ========================================= */
    .profile-card {
      border-radius: var(--radius-lg);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .profile-card:active {
      transform: scale(0.985);
      filter: brightness(1.03);
    }

    .profile-avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 12px rgba(22, 34, 59, 0.16);
      background: rgba(255, 255, 255, 0.75);
    }

    .profile-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      flex: 1;
    }

    .profile-name {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--navy);
      line-height: 1.2;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    .profile-role {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--navy-muted);
      text-transform: uppercase;
    }

    /* =========================================
       2. 中央：スキャンガイド＆写真撮影ボタン
       ========================================= */
    .card-viewport-spacer {
      flex: 1;
      width: var(--ui-width);
      min-height: 120px;
      max-height: 36vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      pointer-events: none;
    }

    /* スキャン待機中のガイド枠 */
    .scan-guide-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .scan-guide-box.is-hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
    }

    .scan-frame {
      width: 240px;
      height: 145px;
      border-radius: 18px;
      border: 1.5px dashed rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 0 9999px rgba(16, 22, 42, 0.22);
    }

    .scan-hint {
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.95);
      background: rgba(22, 34, 59, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* 認識後に右端に表示されるフローティングツール（撮影・再スキャン） */
    .floating-tools {
      position: absolute;
      right: 0;
      bottom: 8px;
      display: flex;
      gap: 8px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.4s ease 0.4s, transform 0.4s ease 0.4s;
    }

    .ui-shell.is-visible .floating-tools {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .tool-pill-btn {
      height: 38px;
      padding: 0 13px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--navy);
      cursor: pointer;
      transition: transform 0.16s ease;
    }

    .tool-pill-btn:active {
      transform: scale(0.94);
    }

    /* 下半分グループ（16:9動画 ＋ 下部ナビ） */
    .bottom-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    /* =========================================
       3. 動画プレーヤー（正確な 16:9）
       ========================================= */
    .video-card {
      border-radius: var(--radius-md);
      aspect-ratio: 16 / 9;
      width: var(--ui-width);
      overflow: hidden;
      position: relative;
      padding: 0;
    }

    .video-element {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: rgba(24, 28, 48, 0.25);
      border-radius: inherit;
    }

    .video-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-align: center;
      padding: 16px;
      pointer-events: none;
    }

    .video-placeholder small {
      font-size: 10px;
      font-weight: 500;
      color: var(--navy-muted);
    }

    .video-center-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      background: rgba(235, 228, 255, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 20px rgba(22, 34, 59, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.25s ease, transform 0.2s ease;
      z-index: 3;
    }

    .video-center-play:active {
      transform: translate(-50%, -50%) scale(0.93);
    }

    .video-center-play.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .video-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 18px 14px 10px;
      background: linear-gradient(to top, rgba(16, 22, 42, 0.62) 0%, rgba(16, 22, 42, 0) 100%);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 3;
    }

    .vc-btn {
      background: none;
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .vc-time {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, 0.92);
      flex-shrink: 0;
    }

    .vc-progress {
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.35);
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .vc-progress-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: inherit;
    }

    /* =========================================
       4. 下部ナビゲーション
       ========================================= */
    .nav-tray {
      border-radius: var(--radius-lg);
      padding: 8px 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: center;
    }

    .nav-item {
      appearance: none;
      background: transparent;
      border: none;
      border-radius: 20px;
      min-height: 54px;
      min-width: 44px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--navy);
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.16s ease, background-color 0.16s ease;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.22);
    }

    .nav-item:active {
      background-color: rgba(255, 255, 255, 0.38);
      transform: scale(0.96);
    }

    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: var(--navy);
      stroke-width: 1.85;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--navy);
    }

    /* =========================================
       モーダル / ボトムシート（Social, About, Photo Preview）
       ========================================= */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(16, 22, 42, 0.36);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 16px max(16px, env(safe-area-inset-bottom));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .sheet-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .glass-sheet {
      width: var(--ui-width);
      border-radius: var(--radius-lg);
      padding: 20px 18px;
      transform: translateY(20px);
      transition: transform 0.32s var(--ease-out-expo);
    }

    .sheet-backdrop.is-open .glass-sheet {
      transform: translateY(0);
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .sheet-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--navy);
    }

    .sheet-close {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.45);
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .social-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-link-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      min-height: 48px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.65);
      color: var(--navy);
      text-decoration: none;
      transition: transform 0.16s ease, background-color 0.16s ease;
    }

    .social-link-row:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.68);
    }

    .social-badge {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(22, 34, 59, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 800;
      font-size: 13px;
      color: var(--navy);
    }

    .social-text {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--navy);
      flex: 1;
    }

    .about-body {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--navy);
      white-space: pre-line;
    }

    /* 撮影した写真のプレビュー */
    .captured-preview-img {
      width: 100%;
      max-height: 55vh;
      object-fit: contain;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 12px;
      display: block;
    }

    .save-photo-btn {
      width: 100%;
      padding: 13px;
      border-radius: 16px;
      border: none;
      background: var(--navy);
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      display: block;
      cursor: pointer;
    }

    /* シャッターフラッシュ演出 */
    .shutter-flash {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .shutter-flash.is-flashing {
      opacity: 0.85;
      transition: none;
    }
  </style>
</head>
<body>

  <!-- シャッターフラッシュ -->
  <div id="shutter-flash" class="shutter-flash"></div>

  <!-- =========================================================
       AR シーン（実物の名刺トラッキング）
       ========================================================= -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 名刺トラッキングアンカー -->
    <a-entity id="card-target" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

  <!-- =========================================================
       画面固定UI（名刺認識後に順次フェードイン）
       ========================================================= -->
  <main id="ui-shell" class="ui-shell" aria-label="MARI AR Business Card Interface">

    <!-- 1. 上部プロフィール -->
    <header
      id="profile-trigger"
      class="lavender-glass profile-card reveal-item reveal-1"
      role="button"
      tabindex="0"
      aria-label="Open About MARI">
      <img
        id="profile-img"
        class="profile-avatar"
        src="./profile.jpg"
        alt="MARI portrait" />
      <div class="profile-info">
        <h1 class="profile-name">MARI</h1>
        <p class="profile-role">PRODUCT DESIGNER</p>
      </div>
    </header>

    <!-- 2. 中央：スキャンガイド ＆ 認識後のツールボタン -->
    <div class="card-viewport-spacer">
      <div id="scan-guide-box" class="scan-guide-box">
        <div class="scan-frame"></div>
        <span class="scan-hint">Point camera at business card</span>
      </div>

      <div class="floating-tools">
        <button id="capture-btn" class="lavender-glass tool-pill-btn" type="button" aria-label="Take photo">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span>Photo</span>
        </button>
        <button id="reset-scan-btn" class="lavender-glass tool-pill-btn" type="button" aria-label="Hide UI and rescan">
          <span>Hide UI</span>
        </button>
      </div>
    </div>

    <!-- 下部グループ（3. 16:9動画 ＋ 4. ナビゲーション） -->
    <div class="bottom-stack">

      <!-- 3. 動画プレーヤー（厳密な 16:9） -->
      <section class="lavender-glass video-card reveal-item reveal-2" aria-label="Featured video">
        <video
          id="promo-video"
          class="video-element"
          playsinline
          webkit-playsinline
          preload="metadata"></video>

        <div id="video-placeholder" class="video-placeholder">
          <span>Video Preview (16:9)</span>
          <small>Set CONFIG.videoSrc in index.html</small>
        </div>

        <button
          id="center-play-btn"
          class="video-center-play"
          type="button"
          aria-label="Play video">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#16223b">
            <polygon points="7,4 20,12 7,20"></polygon>
          </svg>
        </button>

        <div class="video-controls">
          <button id="bar-play-btn" class="vc-btn" type="button" aria-label="Play or pause">
            <svg id="bar-play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="6,4 20,12 6,20"></polygon>
            </svg>
          </button>
          <span id="vc-time" class="vc-time">0:00 / 0:00</span>
          <div id="vc-progress" class="vc-progress" role="slider" aria-label="Seek video" tabindex="0">
            <div id="vc-progress-fill" class="vc-progress-fill"></div>
          </div>
          <button id="mute-btn" class="vc-btn" type="button" aria-label="Toggle mute">
            <svg id="mute-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
          </button>
        </div>
      </section>

      <!-- 4. 下部ナビゲーション -->
      <nav class="lavender-glass nav-tray reveal-item reveal-3" aria-label="Primary navigation">
        <a id="nav-work" class="nav-item" href="#" target="_blank" rel="noopener noreferrer" aria-label="Work — App Showcase">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="3"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <circle cx="7" cy="6.5" r="0.6" fill="currentColor"></circle>
            <circle cx="10" cy="6.5" r="0.6" fill="currentColor"></circle>
          </svg>
          <span class="nav-label">Work</span>
        </a>

        <button id="nav-social" class="nav-item" type="button" aria-label="Social links" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          <span class="nav-label">Social</span>
        </button>

        <a id="nav-contact" class="nav-item" href="#" aria-label="Contact MARI">

  <script>
    /**
     * =========================================================
     * 設定エリア（CONFIG）
     * GitHubリポジトリ内の実ファイル名・URLに合わせて編集してください。
     * =========================================================
     */
    const CONFIG = {
      mindTargetSrc: "./targets.mind",
      profileImageSrc: "./profile.jpg",
      videoSrc: "",
      workUrl: "",
      contactUrl: "",
      aboutText: "",
      socials: [
        { type: "x", label: "Design & Building", url: "" },
        { type: "x", label: "デザインと個人開発", url: "" },
        { type: "note", label: "開発の裏側とアメリカ市場UX", url: "" }
      ]
    };

    document.addEventListener("DOMContentLoaded", () => {
      // 1. アセット・リンク反映
      const scene = document.getElementById("ar-scene");
      if (CONFIG.mindTargetSrc) {
        scene.setAttribute(
          "mindar-image",
          `imageTargetSrc: ${CONFIG.mindTargetSrc}; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;`
        );
      }

      // プロフィール画像（リンク切れ時は優雅なSVGフォールバックを表示）
      const profileImg = document.getElementById("profile-img");
      profileImg.onerror = () => {
        profileImg.src = "data:image/svg+xml;utf8," + encodeURIComponent(
          `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#e8e0ff"/>
                <stop offset="100%" stop-color="#c4b2f8"/>
              </linearGradient>
            </defs>
            <rect width="120" height="120" fill="url(#g)"/>
            <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="600" fill="#16223b">M</text>
          </svg>`
        );
      };
      if (CONFIG.profileImageSrc) {
        profileImg.src = CONFIG.profileImageSrc;
      }

      const workLink = document.getElementById("nav-work");
      if (CONFIG.workUrl) {
        workLink.href = CONFIG.workUrl;
      } else {
        workLink.addEventListener("click", (e) => e.preventDefault());
      }

      const contactLink = document.getElementById("nav-contact");
      if (CONFIG.contactUrl) {
        contactLink.href = CONFIG.contactUrl;
      } else {
        contactLink.addEventListener("click", (e) => e.preventDefault());
      }

      // 2. Social リスト生成
      const socialList = document.getElementById("social-list");
      const validSocials = CONFIG.socials.filter((item) => item.url && item.url.trim() !== "");

      if (validSocials.length === 0) {
        const emptyMsg = document.createElement("p");
        emptyMsg.className = "about-body";
        emptyMsg.textContent = "Social links are not configured yet in CONFIG.socials.";
        socialList.appendChild(emptyMsg);
      } else {
        validSocials.forEach((item) => {
          const a = document.createElement("a");
          a.className = "social-link-row";
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";

          const badge = document.createElement("span");
          badge.className = "social-badge";
          if (item.type === "x") {
            badge.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`;
          } else {
            badge.textContent = "note";
            badge.style.fontSize = "10px";
          }

          const text = document.createElement("span");
          text.className = "social-text";
          text.textContent = item.label;

          a.appendChild(badge);
          a.appendChild(text);
          socialList.appendChild(a);
        });
      }

      // 3. 【修正】名刺を認識した時だけUIをふわっと表示する制御
      const uiShell = document.getElementById("ui-shell");
      const cardTarget = document.getElementById("card-target");
      const scanGuideBox = document.getElementById("scan-guide-box");
      const resetScanBtn = document.getElementById("reset-scan-btn");

      cardTarget.addEventListener("targetFound", () => {
        uiShell.classList.add("is-visible");
        scanGuideBox.classList.add("is-hidden");
      });

      // 手動でUIを隠して再度スキャン状態に戻すボタン
      resetScanBtn.addEventListener("click", () => {
        uiShell.classList.remove("is-visible");
        scanGuideBox.classList.remove("is-hidden");
      });

      // 4. 写真撮影機能（背面カメラ映像 ＋ ARカードUIの合成キャプチャ）
      const captureBtn = document.getElementById("capture-btn");
      const shutterFlash = document.getElementById("shutter-flash");
      const photoBackdrop = document.getElementById("photo-backdrop");
      const photoClose = document.getElementById("photo-close");
      const capturedPreviewImg = document.getElementById("captured-preview-img");
      const savePhotoBtn = document.getElementById("save-photo-btn");

      captureBtn.addEventListener("click", () => {
        // シャッターフラッシュ
        shutterFlash.classList.add("is-flashing");
        requestAnimationFrame(() => {
          setTimeout(() => shutterFlash.classList.remove("is-flashing"), 50);
        });

        const arVideo = document.querySelector("body > video");
        const w = window.innerWidth;
        const h = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        const canvas = document.createElement("canvas");
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);

        // 1) 背面カメラ映像を画面比率(cover)に合わせて描画
        if (arVideo && arVideo.videoWidth > 0) {
          const vw = arVideo.videoWidth;
          const vh = arVideo.videoHeight;
          const scale = Math.max(w / vw, h / vh);
          const drawW = vw * scale;
          const drawH = vh * scale;
          const offsetX = (w - drawW) / 2;
          const offsetY = (h - drawH) / 2;
          ctx.drawImage(arVideo, offsetX, offsetY, drawW, drawH);
        } else {
          ctx.fillStyle = "#16223b";
          ctx.fillRect(0, 0, w, h);
        }

        // 2) 上部プロフィールカードを合成描画
        const drawGlassRect = (rect, radius) => {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(rect.left, rect.top, rect.width, rect.height, radius);
          const grad = ctx.createLinearGradient(rect.left, rect.top, rect.right, rect.bottom);
          grad.addColorStop(0, "rgba(255, 255, 255, 0.82)");
          grad.addColorStop(1, "rgba(226, 216, 252, 0.82)");
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
          ctx.stroke();
          ctx.restore();
        };

        const profRect = document.getElementById("profile-trigger").getBoundingClientRect();
        drawGlassRect(profRect, 32);
        ctx.fillStyle = "#16223b";
        ctx.font = "600 20px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText("MARI", profRect.left + 90, profRect.top + 38);
        ctx.fillStyle = "rgba(22, 34, 59, 0.72)";
        ctx.font = "600 11px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.fillText("PRODUCT DESIGNER", profRect.left + 90, profRect.top + 56);

        // 右下にウォーターマーク
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.font = "600 11px -apple-system, BlinkMacSystemFont, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText("marimo-ux.github.io/ar-card", w - 20, h - 18);

        const dataUrl = canvas.toDataURL("image/png");
        capturedPreviewImg.src = dataUrl;
        savePhotoBtn.href = dataUrl;
        photoBackdrop.classList.add("is-open");
      });

      photoClose.addEventListener("click", () => photoBackdrop.classList.remove("is-open"));
      photoBackdrop.addEventListener("click", (e) => {
        if (e.target === photoBackdrop) photoBackdrop.classList.remove("is-open");
      });

      // 5. 動画プレーヤー制御
      const video = document.getElementById("promo-video");
      const placeholder = document.getElementById("video-placeholder");
      const centerPlayBtn = document.getElementById("center-play-btn");
      const barPlayBtn = document.getElementById("bar-play-btn");
      const barPlayIcon = document.getElementById("bar-play-icon");
      const vcTime = document.getElementById("vc-time");
      const vcProgress = document.getElementById("vc-progress");
      const vcProgressFill = document.getElementById("vc-progress-fill");
      const muteBtn = document.getElementById("mute-btn");
      const muteIcon = document.getElementById("mute-
